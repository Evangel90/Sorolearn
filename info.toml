# -------------------------------------------------------------- quizzes

[[exercises]]
name = "quiz1"
dir = "quizzes"
hint = """
In `vote`:
  1. `voter.require_auth();`
  2. If `storage.has(&DataKey::Voted(voter.clone()))`, return
     `Err(PollError::AlreadyVoted)`.
  3. Otherwise mark the voter (`set(&DataKey::Voted(..), &true)`), read the
     tally with `.unwrap_or(0)`, store tally + 1, and return `Ok(())`.
`votes` reads the tally with a default of 0. `has_voted` is a `has` check."""

[[exercises]]
name = "quiz2"
dir = "quizzes"
hint = """
- Constructor: store `token` and `unlock_time` in instance storage.
- A small helper `fn token_client(env: &Env) -> token::TokenClient<'_>`
  outside the contractimpl block saves repetition.
- deposit: require_auth, validate amount, transfer from -> contract,
  update `DataKey::Savings(from)`, then `Deposited { from, amount }.publish(&env)`.
- withdraw: require_auth, compare `env.ledger().timestamp()` with the unlock
  time, read the savings, zero them, transfer contract -> owner, return the amount."""

# ------------------------------------------------- stellar: accounts

[[exercises]]
name = "accounts1"
dir = "11_stellar_accounts"
stellar = true
hint = """
- xlm_to_stroops: multiply by STROOPS_PER_XLM.
- format_xlm: the fractional part needs all 7 digits, so pad it with zeros:
  `{:07}` instead of `{}`.
- minimum_balance: the formula is (2 + subentries) × BASE_RESERVE.
- spendable: balance minus the minimum balance, but never below zero (`.max(0)`)."""

[[exercises]]
name = "accounts2"
dir = "11_stellar_accounts"
stellar = true
hint = """
- The address is the *public key*, which you derive from the seed:
    let public_key = SigningKey::from_bytes(seed).verifying_key();
    format!("{}", ed25519::PublicKey(public_key.to_bytes()))
- The secret is the seed itself, encoded: `format!("{}", ed25519::PrivateKey(*seed))`.
- `kind` needs arms for `Strkey::Contract(_)` and `Strkey::MuxedAccountEd25519(_)`."""

[[exercises]]
name = "accounts3"
dir = "11_stellar_accounts"
stellar = true
hint = """
- `level`: BumpSequence and AllowTrust are Low; SetOptions and AccountMerge are High.
- `can_submit`: pick the threshold with `match level(op) { ... }`, and count the
  master key: if a signer equals `account.master_key`, add `account.master_weight`."""

# --------------------------------------------- stellar: transactions

[[exercises]]
name = "transactions1"
dir = "12_stellar_transactions"
stellar = true
hint = """
- The sequence number must be `current_sequence + 1`.
- The fee is BASE_FEE *per operation*: `BASE_FEE * operations.len() as u32`.
- Return `Err(TxError::NonPositiveAmount)` if any payment has `stroops <= 0`.
- `memo.try_into()` fails for memos over 28 bytes: map that error to
  `TxError::MemoTooLong` with `.map_err(|_| TxError::MemoTooLong)?` instead of unwrapping."""

[[exercises]]
name = "transactions2"
dir = "12_stellar_transactions"
stellar = true
hint = """
- Hash a `TransactionSignaturePayload`, not the bare transaction:
    let payload = TransactionSignaturePayload {
        network_id: Hash(network_id(passphrase)),
        tagged_transaction: TransactionSignaturePayloadTaggedTransaction::Tx(tx.clone()),
    };
  then sha256 its XDR (`payload.to_xdr(Limits::none())`).
- The hint is the *last* 4 bytes of the public key: `public_key[28..]`."""

# --------------------------------------------------- stellar: assets

[[exercises]]
name = "assets1"
dir = "13_stellar_assets"
stellar = true
hint = """
- Codes may be up to 12 characters, letters and digits only:
  `code.len() > 12 || !code.chars().all(|c| c.is_ascii_alphanumeric())`.
- Codes of 5-12 characters become `Asset::CreditAlphanum12(AlphaNum12 { asset_code: AssetCode12(padded), issuer })`.
- When printing, drop the zero padding: `.trim_end_matches('\\0')`."""

[[exercises]]
name = "assets2"
dir = "13_stellar_assets"
hint = """
Before transferring, ask the Stellar Asset Contract whether the issuer has
approved the employee:
    if !token::StellarAssetClient::new(&env, &token).authorized(&employee) {
        return Err(PayrollError::EmployeeNotAuthorized);
    }"""

# ------------------------------------------------- security: review the AI
#
# Each contract below is plausible AI-generated code with one planted
# vulnerability. `exploit_` tests reproduce the attack; fix the contract.

[[exercises]]
name = "audit_auth"
dir = "14_security"
hint = """
Who loses points in a transfer? That address must authorize it. Look at
which address `transfer` calls `require_auth()` on. Authorizing the
*recipient* lets anyone name themselves as `to` and pull funds from any `from`."""

[[exercises]]
name = "audit_init"
dir = "14_security"
hint = """
`initialize` is a public function anyone can call, as often as they like.
Make it fail if an admin is already stored. Declare an error
(`#[contracterror]` enum with `AlreadyInitialized = 1`) and abort with it:
    if env.storage().instance().has(&DataKey::Admin) {
        panic_with_error!(&env, OracleError::AlreadyInitialized);
    }
Remember to import `contracterror` and `panic_with_error`."""

[[exercises]]
name = "audit_amount"
dir = "14_security"
hint = """
`amount` is an `i128`, so it can be negative. What does
`from_balance < amount` say about -1_000_000? And what do
`from_balance - amount` and `to_balance + amount` do with it?
Add an `InvalidAmount = 2` variant to `CreditsError` and return it
unless `amount > 0`."""

[[exercises]]
name = "audit_storage"
dir = "14_security"
hint = """
Two problems:
1. Temporary storage is deleted for good when its TTL expires. Use
   `env.storage().persistent()` for savings (in `save` *and* `savings`).
2. Persistent entries are archived when their TTL runs out. After writing,
   call `.extend_ttl(&key, SAVINGS_TTL_THRESHOLD, SAVINGS_TTL)`."""

[[exercises]]
name = "audit_token"
dir = "14_security"
hint = """
`deposit` calls `transfer` on whatever `token` address the caller passes in,
and credits the balance as if real USDC arrived. Any contract can have a
`transfer` function. Compare `token` with the address stored at deployment
(`DataKey::Token`). If they differ, return a new `VaultError::UnsupportedToken = 2`."""
