# ---------------------------------------------------------------- intro

[[exercises]]
name = "intro1"
dir = "00_intro"
skip_check_unsolved = true
hint = """
This exercise already passes. Read the comments, then type `n` + Enter."""

[[exercises]]
name = "intro2"
dir = "00_intro"
hint = """
`#[contract]` declares the contract type, but a second attribute exports
its functions and generates the `GreeterClient` used by the tests.
Look at intro1: what is written right above `impl HelloContract`?"""

# ------------------------------------------------------------ functions

[[exercises]]
name = "functions1"
dir = "01_functions"
hint = """
Replace each `todo!()` with an expression. `a + b` adds two numbers, and
the remainder operator `%` tells you whether a number is divisible by 2."""

[[exercises]]
name = "functions2"
dir = "01_functions"
hint = """
1. The client has no `square` method because `square` is not exported.
   Which keyword makes a function part of the public contract interface?
2. `usize` cannot cross the contract boundary. The test passes `u64`
   values, so use `u64` for `cube`'s argument and return type (and drop
   the casts)."""

# ---------------------------------------------------------------- types

[[exercises]]
name = "symbols1"
dir = "02_types"
hint = """
"transfer_from" has 13 characters, too many for `symbol_short!`.
Build it at runtime with `Symbol::new(&env, "transfer_from")`, and rename
`_env` to `env` since you are now using it."""

[[exercises]]
name = "vecs1"
dir = "02_types"
hint = """
- `Vec::new` needs the environment: `Vec::new(&env)`.
- For `sum`, iterate with `for value in values.iter() { ... }` and keep a
  running total (`let mut total = 0;`)."""

[[exercises]]
name = "maps1"
dir = "02_types"
hint = """
Read the current count with `counts.get(word.clone())`, which returns an
Option. `.unwrap_or(0)` turns "missing" into 0. Then store the new value
with `counts.set(word, current + 1)`."""

[[exercises]]
name = "bytes1"
dir = "02_types"
hint = """
- `append` modifies `a` in place, so the parameter must be declared
  mutable: `mut a: Bytes`.
- soroban_sdk::String has a `len()` method that returns a u32."""

# --------------------------------------------------------- custom types

[[exercises]]
name = "types1"
dir = "03_custom_types"
hint = """
Add `#[contracttype]` above the `#[derive(...)]` on `Profile`, and import
`contracttype` from soroban_sdk."""

[[exercises]]
name = "types2"
dir = "03_custom_types"
hint = """
A `match` must cover every variant. Add arms for
`Shape::Rectangle(width, height)` and `Shape::Triangle(base, height)`.
A triangle's area is base * height / 2."""

# -------------------------------------------------------------- storage

[[exercises]]
name = "storage1"
dir = "04_storage"
hint = """
`count` is only a local variable: the new value is never written back.
After incrementing, call `env.storage().instance().set(&COUNTER, &count);`"""

[[exercises]]
name = "storage2"
dir = "04_storage"
hint = """
Write: env.storage().persistent().set(&DataKey::Score(player), &score);
Read:  env.storage().persistent().get(&DataKey::Score(player)).unwrap_or(0)"""

[[exercises]]
name = "storage3"
dir = "04_storage"
hint = """
1. After the `set` in `save_note`, call
   env.storage().persistent().extend_ttl(&key, TTL_THRESHOLD, TTL_EXTEND_TO);
2. In `cache` and `cached`, use `env.storage().temporary()` instead of
   `env.storage().persistent()`."""

# --------------------------------------------------------------- errors

[[exercises]]
name = "errors1"
dir = "05_errors"
hint = """
- In `divide`, check `if b == 0 { return Err(MathError::DivisionByZero); }`
  before dividing.
- `a.checked_add(b)` returns `None` on overflow. Convert that Option into a
  Result with `.ok_or(MathError::Overflow)`."""

[[exercises]]
name = "errors2"
dir = "05_errors"
hint = """
Replace the `panic!` with `panic_with_error!(&env, WalletError::InsufficientFunds);`
and add `panic_with_error` to the `use soroban_sdk::{...}` list."""

# ----------------------------------------------------------------- auth

[[exercises]]
name = "auth1"
dir = "06_auth"
hint = """
Call `user.require_auth();` at the start of `set_nickname`, before
writing anything to storage."""

[[exercises]]
name = "auth2"
dir = "06_auth"
hint = """
1. Rename `init` to `__constructor` so it runs at deployment with the
   arguments passed to `env.register(FeeConfig, (&admin,))`.
2. In `set_fee`, load the admin from instance storage
   (`let admin: Address = env.storage().instance().get(&DataKey::Admin).unwrap();`)
   and call `admin.require_auth();` before storing the fee."""

# --------------------------------------------------------------- events

[[exercises]]
name = "events1"
dir = "07_events"
hint = """
Build the event and publish it:
    Tipped { from, to, amount }.publish(&env);"""

# --------------------------------------------------------------- tokens

[[exercises]]
name = "tokens1"
dir = "08_tokens"
hint = """
1. `from.require_auth();`
2. Load the token address: `env.storage().instance().get(&DataKey::Token).unwrap()`
3. Create a client: `token::TokenClient::new(&env, &token_address)`
4. Transfer to the contract:
   `token.transfer(&from, &env.current_contract_address(), &amount);`"""

# ------------------------------------------------------- cross contract

[[exercises]]
name = "cross1"
dir = "09_cross_contract"
hint = """
Create a client for the calculator:
    let client = calculator::CalculatorClient::new(&env, &calculator);
Then call `client.add(&a, &b)` and add `c` to the result with a second
call. Client methods take references."""

# ----------------------------------------------------------------- time

[[exercises]]
name = "time1"
dir = "10_time"
hint = """
`unlock_time` is a UNIX timestamp, but the code compares it with the ledger
*sequence number*. Use `env.ledger().timestamp()` instead."""

# -------------------------------------------------------------- quizzes

[[exercises]]
name = "quiz1"
dir = "quizzes"
hint = """
In `vote`:
  1. `voter.require_auth();`
  2. If `storage.has(&DataKey::Voted(voter.clone()))`, return
     `Err(PollError::AlreadyVoted)`.
  3. Otherwise mark the voter (`set(&DataKey::Voted(..), &true)`), read the
     tally with `.unwrap_or(0)`, store tally + 1, and return `Ok(())`.
`votes` reads the tally with a default of 0. `has_voted` is a `has` check."""

[[exercises]]
name = "quiz2"
dir = "quizzes"
hint = """
- Constructor: store `token` and `unlock_time` in instance storage.
- A small helper `fn token_client(env: &Env) -> token::TokenClient<'_>`
  outside the contractimpl block saves repetition.
- deposit: require_auth, validate amount, transfer from -> contract,
  update `DataKey::Savings(from)`, then `Deposited { from, amount }.publish(&env)`.
- withdraw: require_auth, compare `env.ledger().timestamp()` with the unlock
  time, read the savings, zero them, transfer contract -> owner, return the amount."""

# ------------------------------------------------- security: review the AI
#
# Each contract below is plausible AI-generated code with one planted
# vulnerability. `exploit_` tests reproduce the attack; fix the contract.

[[exercises]]
name = "audit_auth"
dir = "11_security"
hint = """
Who loses points in a transfer? That address must authorize it. Look at
which address `transfer` calls `require_auth()` on. Authorizing the
*recipient* lets anyone name themselves as `to` and pull funds from any `from`."""

